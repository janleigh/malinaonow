name: Development Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - develop
      - development

jobs:
  build:
    name: EAS Development Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: bun install

      - name: Build for Android (development)
        run: eas build --platform android --profile development --non-interactive

      - name: Build for iOS (development)
        run: eas build --platform ios --profile development --non-interactive
